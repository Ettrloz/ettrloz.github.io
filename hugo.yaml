baseURL: https://ettrloz.github.io/
locale: en
title: Ettrloz
description: Full Stack Web Developer

languages:
  en:
    locale: en-US
    weight: 1

pagination:
  pagerSize: 5

params:
  author: Ettrloz
  description: Full Stack Web Developer
  twitterHandle: "@ettrloz"
  ogLocale: en_US
  social:
    - https://github.com/ettrloz
    - https://twitter.com/ettrloz

build:
  buildStats:
    enable: true
  cachebusters:
  - source: 'assets/notwatching/hugo_stats\.json'
    target: css

module:
  mounts:
  - source: assets
    target: assets
  - disableWatch: true
    source: hugo_stats.json
    target: assets/notwatching/hugo_stats.json

security:
  exec:
    allow:
    - ^(dart-)?sass$
    - ^go$
    - ^git$
    - ^node$
    - ^postcss$
    - ^tailwindcss$
