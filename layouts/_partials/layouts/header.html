<header
  class="bg-surface/80 sticky top-[var(--scroll-gap)] z-50 mx-auto flex w-[calc(var(--body-width)-calc(var(--scroll-gap)*2))] items-center justify-between rounded-[var(--scroll-gap)] p-4 backdrop-blur-md [--scroll-gap:0rem] md:rounded-b-[max(var(--scroll-gap),0.5rem)]"
  x-data="navbar"
>
  <a href="{{ "/" | relURL }}" class="text-lg font-bold">
    <img alt="{{ site.Title }}" src="{{ urls.RelURL "/assets/logo.png" }}"/ width="24px" height="24px" loading="eager">
  </a>
  <button class="bg-transparent text-current md:hidden" aria-label="Show Navigations">
    <i data-lucide="menu"></i>
  </button>
</header>
